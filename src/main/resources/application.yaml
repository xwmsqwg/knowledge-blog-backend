spring:
  # 连接数据库
  application:
    name: IOTBackend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/knowledge_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD}"
    hikari:
      maximum-pool-size: 10

# 配置 MyBatis-plus 的运行行为
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xrf.iotbackend.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 开启spring事务管理日志
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

# 设置jwt密钥
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 604800000
