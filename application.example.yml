spring:
  application:
    name: IOTBackend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/knowledge_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

mybatis-plus:
  mapper-locations: classpath*:/com/xrf/IOTBackend/mapper/**/*.xml
  type-aliases-package: com.xrf.iotbackend.model.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    version: OPENAPI_3_0

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 604800000

logging:
  file:
    name: logs/iotbackend.log
  level:
    root: INFO
    com.xrf.iotbackend: INFO
  logback:
    rollingpolicy:
      file-name-pattern: logs/archive/iotbackend.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB